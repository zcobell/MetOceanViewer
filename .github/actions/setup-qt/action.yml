name: Install Qt
description: >
  Install Qt $QT_VERSION with $QT_MODULES (aqtinstall, cached), which exports
  QT_ROOT_DIR for the Qt presets and the maplibre-native-qt port. On Linux also
  install the system libraries Qt needs to build and to run under Xvfb, and
  the zlib MapLibre links, as in tools/dev/Dockerfile. Requires load-versions
  first.
inputs:
  arch:
    description: aqtinstall architecture (linux_gcc_64, clang_64, win64_msvc2022_64).
    required: true
runs:
  using: composite
  steps:
    - name: Qt system libraries (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libdbus-1-3 libegl-dev libegl1 libfontconfig1 libfreetype6 libgl-dev libgl1 \
          libgl1-mesa-dri libglib2.0-0t64 libopengl-dev libvulkan-dev libx11-xcb1 \
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
          libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-dev \
          libxkbcommon-x11-0 xauth xvfb zlib1g-dev
    - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
      with:
        version: ${{ env.QT_VERSION }}
        arch: ${{ inputs.arch }}
        modules: ${{ env.QT_MODULES }}
        cache: true

#
# Third-party actions are pinned to a commit SHA (version in the trailing
# comment; Dependabot keeps them current). Toolchain versions come from
# tools/versions.env through .github/actions/load-versions.

name: CI

on:
  pull_request:
  push:
    branches: [master, v5]

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to a branch is tested.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  VCPKG_DISABLE_METRICS: 1
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  build-test:
    name: build-test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # A cold vcpkg cache builds MapLibre Native Qt (see the Configure step).
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            preset: ci-linux
            compiler-cache: ccache
            qt-arch: linux_gcc_64
          - name: macos-arm64-appleclang
            os: macos-15
            preset: ci-macos
            compiler-cache: ccache
            qt-arch: clang_64
          - name: windows-msvc
            os: windows-2022
            preset: ci-windows
            compiler-cache: sccache
            qt-arch: win64_msvc2022_64
    env:
      # 'true': install Qt and configure with MOV_ENABLE_QT=ON, which adds the
      # Qt Quick app (src/ui), its GUI test and the vcpkg feature "gui"
      # (MapLibre Native Qt). The Qt-free path (core, io) stays covered by the
      # sanitizer, fuzz and coverage jobs.
      BUILD_QT: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-versions

      - uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      - name: Select GCC (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-gcc

      - name: Generate de_DE.UTF-8 (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-locales

      # Apple Clang must provide <expected> and <format>: Xcode 16 and later
      # do. macos-14 images are retired on 2026-11-02, so the job runs on
      # macos-15, with Xcode 16.2 pinned: the same Apple Clang 16 that the job
      # used on macos-14 (setup-xcode '16' resolved to 16.2 there), and the
      # oldest toolchain we support. Its libc++ lacks constexpr
      # variant<string>, stop_token, floating from_chars and ranges::fold_left;
      # the code and tests are written for that, and the libcxx job below
      # catches regressions earlier. The deployment target stays macOS 14
      # (CMAKE_OSX_DEPLOYMENT_TARGET in the preset).
      - name: Select Xcode 16.2 (macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '16.2'

      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ matrix.name }}
          variant: ${{ matrix.compiler-cache }}
          max-size: 500M

      # Its own key: the Qt-free jobs save caches without MapLibre. Saved
      # below right after the configure, which is where vcpkg builds. On a
      # cold cache, this job (linux-gcc) and clang-tidy build MapLibre in
      # parallel with the same key; whichever saves first wins, and the
      # other's save is a harmless "cache already exists" warning.
      - uses: ./.github/actions/setup-vcpkg
        id: vcpkg
        with:
          cache-key: ${{ matrix.name }}-gui
          restore-only: 'true'

      - name: Qt
        if: env.BUILD_QT == 'true'
        uses: ./.github/actions/setup-qt
        with:
          arch: ${{ matrix.qt-arch }}

      - name: Configure
        id: configure
        run: |
          # setup-qt exports QT_ROOT_DIR; MOV_ENABLE_QT selects the vcpkg
          # feature "gui", whose port builds MapLibre against that Qt.
          if [[ "${BUILD_QT}" == true ]]; then
            cmake --preset "${{ matrix.preset }}" -DMOV_ENABLE_QT=ON "-DCMAKE_PREFIX_PATH=${QT_ROOT_DIR}"
          else
            cmake --preset "${{ matrix.preset }}"
          fi

      # Also after a failed configure: vcpkg archives only the ports it built
      # successfully, so a partial cache still spares those rebuilds.
      - name: Save vcpkg binary cache
        if: always() && steps.configure.outcome != 'skipped' && steps.vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.vcpkg.outputs.cache-path }}
          key: ${{ steps.vcpkg.outputs.cache-key }}

      # Surfaces compiler diagnostics as annotations, readable without log access.
      - name: Register compiler problem matchers
        run: echo "::add-matcher::.github/problem-matchers/compilers.json"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: qmllint
        if: env.BUILD_QT == 'true'
        run: cmake --build --preset ${{ matrix.preset }} --target all_qmllint

      # Label qt (offscreen, no GL: the maplibre plugin loads, app identity)
      # runs everywhere. Label gui needs OpenGL: on Linux it runs under
      # xvfb-run with Mesa (tests/CMakeLists.txt sets the launcher); the
      # macOS and Windows jobs build it but do not run it yet.
      - name: Test
        id: test
        run: |
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            ctest --preset ${{ matrix.preset }}
          else
            ctest --preset ${{ matrix.preset }} --label-exclude gui
          fi

      # Failed tests as one annotation, readable through the public API.
      - name: Report failed tests
        if: failure() && steps.test.outcome == 'failure'
        run: |
          failed="build/${{ matrix.preset }}/Testing/Temporary/LastTestsFailed.log"
          [[ -f "${failed}" ]] || exit 0
          out="$(ctest --preset ${{ matrix.preset }} --rerun-failed --output-on-failure 2>&1 | tail -c 12000)"
          out="${out//'%'/'%25'}"; out="${out//$'\r'/'%0D'}"; out="${out//$'\n'/'%0A'}"
          echo "::error title=ctest failures::${out}"

      - name: Upload GUI screenshot
        if: always() && runner.os == 'Linux' && env.BUILD_QT == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: gui-screenshot
          path: build/${{ matrix.preset }}/tests/ui/screenshots/
          if-no-files-found: ignore

  sanitizers:
    name: asan-ubsan (linux-gcc)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-versions
      - uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
      - uses: ./.github/actions/setup-gcc
      - uses: ./.github/actions/setup-locales
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: asan
          max-size: 500M
      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: linux-gcc
      - run: cmake --workflow --preset asan

  # Clang + libc++ at Apple's level (LIBCXX_VERSION in tools/versions.env):
  # catches the standard-library gaps of the macOS job (constexpr
  # variant<string>, stop_token, floating from_chars, ranges) on Linux, where
  # the build is fast and its log is readable. Blocking: it is deterministic
  # and takes the time of one Debug build.
  libcxx:
    name: libc++ (linux-clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-versions
      - uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
      - uses: ./.github/actions/setup-gcc # vcpkg builds the C ports with cc, as in the dev image
      - uses: ./.github/actions/setup-libcxx
      - uses: ./.github/actions/setup-locales
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: libcxx
          max-size: 500M
      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: linux-libcxx
      - run: cmake --workflow --preset dev-libcxx

  fuzz:
    name: fuzz (linux-clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-versions
      - uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
      - uses: ./.github/actions/setup-gcc # vcpkg builds ports with c++, as in the dev image
      - uses: ./.github/actions/setup-llvm
      - uses: ./.github/actions/setup-locales
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: fuzz
          max-size: 500M
      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: linux-gcc
      # Unit tests plus every fuzz target for MOV_FUZZ_SECONDS each.
      - run: cmake --workflow --preset fuzz
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts
          path: build/fuzz/**/*.work/
          if-no-files-found: ignore

  coverage:
    name: coverage (linux-gcc)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-versions
      - uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r tools/dev/requirements.txt
      - uses: ./.github/actions/setup-gcc
      - uses: ./.github/actions/setup-locales
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: coverage
          max-size: 500M
      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: linux-gcc
      # Builds, runs the tests and writes build/coverage/coverage-report/;
      # fails below the floors in the coverage preset (80% overall, 90% per
      # Qt-free layer).
      - run: cmake --workflow --preset coverage
      - name: Coverage summary
        if: always()
        run: cat build/coverage/coverage-report/summary.txt >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: build/coverage/coverage-report/
          if-no-files-found: ignore
      # Without the CODECOV_TOKEN secret the upload is attempted tokenless and
      # a failure does not fail the job.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/coverage/coverage-report/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  clang-tidy:
    runs-on: ubuntu-24.04
    # The tidy preset includes the Qt layers, so a cold vcpkg cache builds
    # MapLibre Native Qt here too.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-versions
      - uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
      - uses: ./.github/actions/setup-gcc # vcpkg builds ports with c++, as in the dev image
      - uses: ./.github/actions/setup-llvm
      # The same ports and compiler as build-test (linux-gcc): share its cache.
      - uses: ./.github/actions/setup-vcpkg
        id: vcpkg
        with:
          cache-key: linux-gcc-gui
          restore-only: 'true'
      - uses: ./.github/actions/setup-qt
        with:
          arch: linux_gcc_64
      # Configure only: the gate needs the compile database (and the headers
      # generated at configure time), not a build.
      - id: configure
        run: cmake --preset tidy
      - if: always() && steps.configure.outcome != 'skipped' && steps.vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.vcpkg.outputs.cache-path }}
          key: ${{ steps.vcpkg.outputs.cache-key }}
      - run: python3 tools/clang_tidy_gate.py -p build/tidy

  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r tools/dev/requirements.txt
      # rsvg-convert for the icons hook (tools/make_icons.py --check); the
      # same librsvg as the dev image (Ubuntu 24.04).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pre-commit run --all-files --show-diff-on-failure --color always

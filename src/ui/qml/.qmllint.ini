;
; qmllint settings for the QML under src/ui (the all_qmllint target, run by
; CI): any warning fails the lint. The other settings keep qmllint's defaults;
; CompilerWarnings stays off, since it flags members of Qt's own non-final
; types (Application.version, QtPositioning.coordinate) that may be shadowed.
[General]
MaxWarnings=0
